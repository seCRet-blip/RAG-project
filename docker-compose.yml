# RAG project services — isolated from other Docker stacks.
#
# IMPORTANT: Do not use ports 8787 (dashboard) or 8001 (multi-asset-scheduler).
#
# Start vLLM (small model, ~1-2 GB VRAM):
#   docker compose --profile vllm up -d vllm
#
# Qdrant (only if rag-qdrant is not already running):
#   docker compose --profile qdrant up -d qdrant

networks:
  rag-project-net:
    external: true
    name: rag-project-net

services:
  qdrant:
    profiles: ["qdrant"]
    image: qdrant/qdrant:v1.13.2
    container_name: rag-qdrant
    networks:
      - rag-project-net
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:latest
    container_name: rag-vllm
    networks:
      - rag-project-net
    ports:
      - "8002:8000"  # 8001 is used by multi-asset-scheduler
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model Qwen/Qwen2.5-0.5B-Instruct
      --host 0.0.0.0
      --port 8000
      --max-model-len 2048
      --gpu-memory-utilization 0.35
      --dtype half
      --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qdrant_storage:
